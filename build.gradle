plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'exchange-rate-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2025.1.0")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.4'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-cache-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.cloud:spring-cloud-contract-wiremock'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events "failed", "skipped"
    }
}

tasks.named('bootRun') {
    def envFile = file(".env")
    def envFromFile = [:]
    if (envFile.exists()) {
        envFile.readLines('UTF-8').each { line ->
            def trimmed = line.trim()
            if (!trimmed || trimmed.startsWith('#')) {
                return
            }
            def idx = trimmed.indexOf('=')
            if (idx <= 0) {
                return
            }
            def key = trimmed.substring(0, idx).trim()
            def value = trimmed.substring(idx + 1).trim()
            if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) {
                value = value.substring(1, value.length() - 1)
            }
            if (key) {
                envFromFile[key] = value
            }
        }
    }
    def envOrProp = { String name ->
        envFromFile.get(name) ?: System.getenv(name) ?: (project.hasProperty(name) ? project.property(name) : null)
    }
    def hostKey = envOrProp('EXCHANGERATE_HOST_API_KEY')
    if (hostKey != null) {
        environment 'EXCHANGERATE_HOST_API_KEY', hostKey
    }
    def fcaKey = envOrProp('FREECURRENCYAPI_KEY')
    if (fcaKey != null) {
        environment 'FREECURRENCYAPI_KEY', fcaKey
    }
}
