server:
  port: 8081
  servlet:
    context-path: /api
spring:
  application:
    name: exchange-rate-service

exchange-rate:
  providers:
    frankfurter:
      base-url: https://api.frankfurter.dev/v1
    exchangerate-host:
      base-url: https://api.exchangerate.host
      access-key: ${EXCHANGERATE_HOST_API_KEY:}
    freecurrencyapi:
      base-url: https://api.freecurrencyapi.com/v1
      access-key: ${FREECURRENCYAPI_KEY:}
